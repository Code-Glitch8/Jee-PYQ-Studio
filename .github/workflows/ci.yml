name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - name: Check that no secrets are in the frontend
        run: |
          if grep -rEn "service_role|sb_secret_|SUPABASE_SERVICE_ROLE_KEY|GEMINI_API_KEY|OPENROUTER_API_KEY" index.html js css; then echo "Secret-like text found in frontend files"; exit 1; fi
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-importer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-importer/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q tests
